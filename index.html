<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPA Simulation Project</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="brand">
                <i class="fa-solid fa-layer-group"></i>
                <h2>SPA Portal</h2>
            </div>
            <nav class="nav-menu">
                <a href="#home" class="nav-link active" data-route="home">
                    <i class="fa-solid fa-house"></i> Home
                </a>
                <a href="#dashboard" class="nav-link" data-route="dashboard">
                    <i class="fa-solid fa-chart-pie"></i> Dashboard
                </a>
                <a href="#profile" class="nav-link" data-route="profile">
                    <i class="fa-solid fa-user"></i> Profile
                </a>
                <a href="#settings" class="nav-link" data-route="settings">
                    <i class="fa-solid fa-gear"></i> Settings
                </a>
            </nav>
        </aside>

        <!-- Main Content Wrapper -->
        <div class="main-wrapper">
            <header class="top-header">
                <div class="header-title">
                    <span id="current-view-title">Home Overview</span>
                </div>
                <div class="user-profile-badge">
                    <i class="fa-solid fa-circle-user"></i>
                    <span>Komalpreet Kaur</span>
                </div>
            </header>

            <!-- Dynamic Viewport Container -->
            <main id="app-container" class="content-viewport">
                <!-- Content gets dynamically loaded here -->
            </main>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
